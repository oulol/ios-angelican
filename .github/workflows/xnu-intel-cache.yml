name: xnu-intel-cache

on:
  workflow_dispatch:
    inputs:
      macos_version:
        description: macOS release whose xnu to build (13.5 = xnu-8796, iOS 16 era)
        default: "13.5"
      kernel_config:
        description: RELEASE / DEVELOPMENT / DEBUG
        default: DEVELOPMENT
      machine_config:
        description: xnu MACHINE_CONFIG
        default: ANGELICAN
      keep_going:
        description: make -k (collect all compile errors in one run)
        default: "true"

#   push:
#     branches: [main]
#     paths:
#       - "xnu/patches/**"

concurrency:
  group: xnu-${{ github.ref }}
  cancel-in-progress: true

env:
  DXB_REPO: https://github.com/blacktop/darwin-xnu-build
  DXB_SHA: 663906528d1cd5ea8fde7de6f16de73db9511549

  MACOS_VERSION: ${{ inputs.macos_version || '13.5' }}
  KERNEL_CONFIG: ${{ inputs.kernel_config || 'DEVELOPMENT' }}
  MACHINE_CONFIG: ${{ inputs.machine_config || 'ANGELICAN' }}

jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 120

    env:
      # XNU 8796 has built-in CCACHE support.
      CCACHE: ccache
      CCACHE_COMPILERCHECK: content

      # Use preprocessor mode for stronger correctness when patches
      # introduce new headers or alter include resolution.
      CCACHE_NODIRECT: "true"
      CCACHE_MAXSIZE: 5G

    steps:
      - uses: actions/checkout@v4

      - name: Fetch build script
        run: |
          git init -q dxb
          git -C dxb fetch -q --depth 1 "$DXB_REPO" "$DXB_SHA"
          git -C dxb checkout -q FETCH_HEAD

          # Copy the CURRENT patches from this repository.
          cp xnu/patches/*.patch xnu/patches/*.sh dxb/patches/

          # libfirehose_kernel is built arm64e-only;
          # the SWEET kernel is plain arm64.
          sed -i '' \
            's/ARCHS="x86_64 arm64e" VALID_ARCHS="x86_64 arm64e"/ARCHS="x86_64 arm64e arm64" VALID_ARCHS="x86_64 arm64e arm64"/' \
            dxb/build.sh

          grep -c 'VALID_ARCHS="x86_64 arm64e arm64"' dxb/build.sh
          ls dxb/patches

      - name: Deps
        id: deps
        run: |
          brew install jq gum bash cmake ninja ccache

          # build.sh only checks that xcodes exists.
          # Xcode is already preinstalled on the runner.
          printf '#!/bin/sh\nexit 0\n' |
            sudo tee /usr/local/bin/xcodes >/dev/null
          sudo chmod +x /usr/local/bin/xcodes

          sw_vers
          ls -d /Applications/Xcode*.app

          XC=$(ls -d /Applications/Xcode_*.app | sort -V | head -1)
          echo "DEVELOPER_DIR=$XC/Contents/Developer" >> "$GITHUB_ENV"

          sudo xcode-select -s "$XC"

          xcodebuild -version
          xcrun --find iig
          ccache --version
          which ccache

          XCODE_VERSION=$(xcodebuild -version | awk '/^Xcode / {print $2}')
          XCODE_BUILD=$(xcodebuild -version | awk '/^Build version/ {print $3}')

          echo "CCACHE_DIR=$RUNNER_TEMP/ccache" >> "$GITHUB_ENV"
          echo "xcode_key=${XCODE_VERSION}-${XCODE_BUILD}" >> "$GITHUB_OUTPUT"

      # Cache intermediate build products, NOT XNU source.
      # Deliberately does not include a patch hash: unchanged compilation
      # results can still be reused after changing a patch.
      - name: Restore build cache
        uses: actions/cache/restore@v4
        with:
          path: dxb/build
          key: xnu-build-v3-${{ runner.os }}-${{ runner.arch }}-${{ env.MACOS_VERSION }}-${{ env.KERNEL_CONFIG }}-${{ env.MACHINE_CONFIG }}-${{ steps.deps.outputs.xcode_key }}-${{ env.DXB_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            xnu-build-v3-${{ runner.os }}-${{ runner.arch }}-${{ env.MACOS_VERSION }}-${{ env.KERNEL_CONFIG }}-${{ env.MACHINE_CONFIG }}-${{ steps.deps.outputs.xcode_key }}-${{ env.DXB_SHA }}-

      # fakeroot contains generated/installed files, including XNU headers.
      # Only restore it for the EXACT same patch set.
      - name: Restore staging cache
        uses: actions/cache/restore@v4
        with:
          path: dxb/fakeroot
          key: xnu-fakeroot-v3-${{ runner.os }}-${{ runner.arch }}-${{ env.MACOS_VERSION }}-${{ env.KERNEL_CONFIG }}-${{ env.MACHINE_CONFIG }}-${{ steps.deps.outputs.xcode_key }}-${{ env.DXB_SHA }}-${{ hashFiles('xnu/patches/**') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            xnu-fakeroot-v3-${{ runner.os }}-${{ runner.arch }}-${{ env.MACOS_VERSION }}-${{ env.KERNEL_CONFIG }}-${{ env.MACHINE_CONFIG }}-${{ steps.deps.outputs.xcode_key }}-${{ env.DXB_SHA }}-${{ hashFiles('xnu/patches/**') }}-

      # Compiler cache is content-based, so it can be reused across
      # different XNU patch revisions without reusing stale results.
      - name: Restore compiler cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/ccache
          key: xnu-ccache-v3-${{ runner.os }}-${{ runner.arch }}-${{ env.MACOS_VERSION }}-${{ steps.deps.outputs.xcode_key }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            xnu-ccache-v3-${{ runner.os }}-${{ runner.arch }}-${{ env.MACOS_VERSION }}-${{ steps.deps.outputs.xcode_key }}-

      - name: Prepare incremental build
        shell: bash
        run: |
          mkdir -p dxb/build
          mkdir -p dxb/fakeroot/System/Library/Kernels
          mkdir -p "$CCACHE_DIR"

          KERNEL_TYPE="$(
            printf '%s.%s' "$KERNEL_CONFIG" "$MACHINE_CONFIG" |
              tr '[:upper:]' '[:lower:]'
          )"

          # build.sh skips make if this file exists.
          # Keep all intermediate objects, but force the kernel build/link.
          rm -f "dxb/build/xnu.obj/kernel.$KERNEL_TYPE"

          # Avoid accidentally collecting an old installed kernel after
          # a failed build.
          find dxb/fakeroot/System/Library/Kernels \
            -maxdepth 1 -type f -delete

          # Clear statistics, NOT the actual compiler cache.
          ccache -z

          echo "Kernel target: $KERNEL_TYPE"
          echo "Build cache restored:"
          du -sh dxb/build || true
          echo "Compiler cache:"
          ccache -s

      - name: Build
        working-directory: dxb
        env:
          MAKEFLAGS: ${{ inputs.keep_going == 'false' && '' || '-k' }}
        run: bash build.sh

      - name: Compiler cache statistics
        if: always()
        run: ccache -s || true

      # Save intermediate outputs independently from the patch revision.
      - name: Save build cache
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: dxb/build
          key: xnu-build-v3-${{ runner.os }}-${{ runner.arch }}-${{ env.MACOS_VERSION }}-${{ env.KERNEL_CONFIG }}-${{ env.MACHINE_CONFIG }}-${{ steps.deps.outputs.xcode_key }}-${{ env.DXB_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}

      # Save generated staging files only under the exact patch hash.
      - name: Save staging cache
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: dxb/fakeroot
          key: xnu-fakeroot-v3-${{ runner.os }}-${{ runner.arch }}-${{ env.MACOS_VERSION }}-${{ env.KERNEL_CONFIG }}-${{ env.MACHINE_CONFIG }}-${{ steps.deps.outputs.xcode_key }}-${{ env.DXB_SHA }}-${{ hashFiles('xnu/patches/**') }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Save compiler cache
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/ccache
          key: xnu-ccache-v3-${{ runner.os }}-${{ runner.arch }}-${{ env.MACOS_VERSION }}-${{ steps.deps.outputs.xcode_key }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Package build tree for local compiles
        if: always()
        run: |
          SDK=$(xcrun --sdk macosx --show-sdk-path)

          mkdir -p sdk-kernel-platform

          cp -R \
            "$SDK/System/Library/Frameworks/Kernel.framework/Versions/A/PrivateHeaders/platform" \
            sdk-kernel-platform/ || true

          tar czf buildtree.tgz \
            --exclude='*.o' \
            --exclude='*.cpo' \
            --exclude='*.a' \
            --exclude='*.dSYM' \
            --exclude='*.unstripped' \
            --exclude='kernel.development.*' \
            --exclude='.git' \
            -C dxb build/xnu.obj fakeroot/usr/local/include xnu \
            -C .. sdk-kernel-platform

          ls -lah buildtree.tgz

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xnu-buildtree
          path: buildtree.tgz
          retention-days: 7

      - name: Inspect closed KDK support libs
        if: always()
        run: |
          mkdir -p out/kdk-libs

          for lib in /Library/Developer/KDKs/*/System/Library/KernelSupport/lib*.a; do
            [ -f "$lib" ] || continue

            b=$(basename "$lib" .a)

            ar t "$lib" > "out/kdk-libs/$b.members.txt" 2>&1 || true
            nm -m "$lib" > "out/kdk-libs/$b.nm.txt" 2>&1 || true
            lipo -info "$lib" >> out/kdk-libs/arch.txt 2>&1 || true
          done

          ls -la out/kdk-libs

      - name: Collect
        if: always()
        run: |
          mkdir -p out

          cp -R dxb/fakeroot/System/Library/Kernels/. out/ 2>/dev/null || true

          ls -la out

          (cd out && shasum -a 256 kernel.* > SHA256SUMS) || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xnu-kernel
          path: out/
          if-no-files-found: warn
